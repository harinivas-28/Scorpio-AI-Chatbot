<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorpio-Home</title>
    <link rel="icon" href="{{ url_for('static', filename='scorpio.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,500,600">
</head>
<body>
    <nav class="navbar">
        <div class="scorpio">
            <a href="/">
                <img class="logo" src="https://i.ibb.co/2htwL5V/scorpio-zodiac-sign-507316-19.jpg" alt="Scorpio" border="0">
            </a>
            <h1>Scorpio</h1>
        </div>
        <ul class="nav-links">
            <li><a href="/" class="active">Home</a></li>
            <li><a href="/history">History</a></li>
            <li class="dropdown">
                <a href="#" class="dropdown-btn">Projects</a>
                <ul class="dropdown-content">
                    <li><a href="https://harinivas-28.github.io/SignIn-SignUp-Page/">Login Page</a></li>
                    <li><a href="https://github.com/harinivas-28/Text-2-SQL-v2">Text-2-SQL</a></li>
                    <li><a href="/portfolio">Coming Soon...</a></li>
                </ul>
            </li>
            <li><a href="/about">About</a></li>
            <li><a href="/contact">Contact</a></li>
            <li><a href="/portfolio">Portfolio</a></li>
        </ul>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Scorpio - AI Chatbot</h1>
            <p>Ask me anything and I'll help you find the answers</p>
        </div>
        <div class="chat-messages">
            {% if response %}
                <div class="chat-message user">
                    <p>{{ user_question }}</p> 
                </div>
                <div class="chat-message chatbot">
                    <p>{{ response|safe }}</p> 
                </div>
            {% endif %}
        </div>
        <form method="POST" enctype="multipart/form-data">
            <input type="text" name="user_question" placeholder="Ask a question..." required>
            <label for="file-upload" class="custom-file-upload">
                <input type="file" id="file-upload" name="uploaded_files" multiple>
            </label>
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
